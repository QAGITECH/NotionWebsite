<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>你好，我是詹叔。</title>
    <!-- 引入 Font Awesome 图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" xintegrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&display=swap');
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #12121a;
            font-family: 'Noto Sans SC', sans-serif;
            overflow-x: hidden; /* 防止意外的水平滚动 */
        }

        /* --- 返回首页按钮样式 --- */
        .home-button {
            position: fixed;
            top: 30px;
            left: 30px;
            z-index: 100;
            display: flex;
            align-items: center;
            padding: 8px 16px;
            background-color: rgba(42, 42, 62, 0.5);
            color: #a0a0c0;
            text-decoration: none;
            border-radius: 50px;
            font-size: 14px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: all 0.3s ease;
        }

        .home-button:hover {
            background-color: rgba(60, 60, 90, 0.7);
            color: #e0e0e0;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .home-button svg {
            margin-right: 6px;
        }

        /* --- 社交媒体侧边栏样式 --- */
        .social-links {
            position: fixed;
            left: 30px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 15px; /* 图标之间的间距 */
            z-index: 100;
        }

        .social-item {
            position: relative; /* 用于定位二维码 */
            cursor: pointer;
        }
        
        .social-content {
            display: flex;
            align-items: center;
            padding: 8px 16px;
            width: 100px; /* 固定宽度，保持对齐 */
            background-color: rgba(42, 42, 62, 0.5);
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: all 0.3s ease;
        }

        .social-item:hover .social-content {
            background-color: rgba(60, 60, 90, 0.7);
            transform: scale(1.05);
        }

        .social-content i {
            font-size: 20px;
            color: #a0a0c0;
            margin-right: 12px;
            width: 20px; /* 固定图标宽度，让文字对齐 */
            text-align: center;
            transition: color 0.3s ease;
        }
        
        .social-content span {
            font-size: 14px;
            color: #a0a0c0;
            transition: color 0.3s ease;
        }

        .social-item:hover .social-content i,
        .social-item:hover .social-content span {
            color: #e0e0e0;
        }

        /* --- 二维码弹出样式 --- */
        .qr-code {
            position: absolute;
            top: 50%; 
            left: calc(100% + 15px); 
            transform: translateY(-50%) translateX(-10px);
            width: 150px;
            height: 150px;
            padding: 5px;
            background-color: #fff;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.3s ease, transform 0.3s ease, visibility 0.3s;
        }
        
        .qr-code img {
            width: 100%;
            height: 100%;
            border-radius: 8px;
            display: block;
        }
        
        /* This class is toggled by JS on click/tap */
        .social-item.show-qr .qr-code {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
            transform: translateY(-50%) translateX(0);
        }

        /* This is for hover on DESKTOP ONLY, using a media query for devices that can hover */
        @media (hover: hover) and (pointer: fine) {
            .social-item:hover .qr-code {
                opacity: 1;
                visibility: visible;
                pointer-events: auto;
                transform: translateY(-50%) translateX(0);
            }
        }

        .card-container {
            width: 400px;
            height: 600px;
            filter: drop-shadow(0px 10px 30px rgba(30, 30, 80, 0.25));
            transition: width 0.3s ease, height 0.3s ease;
        }
        svg text {
            font-family: 'Noto Sans SC', sans-serif;
        }

        /* --- 移动端响应式样式 --- */
        @media (max-width: 768px) {
            .card-container {
                width: 90vw; /* 使用视口宽度，更灵活 */
                max-width: 400px;
                height: auto; /* 高度自适应 */
            }

            .home-button {
                top: 15px;
                left: 15px;
            }

            /* 将社交链接移动到屏幕底部 */
            .social-links {
                left: 0;
                right: 0;
                top: auto;
                bottom: 20px;
                transform: none; /* 重置垂直居中 */
                flex-direction: row; /* 水平排列 */
                justify-content: center; /* 居中对齐 */
                width: 100%;
                gap: 20px;
            }

            /* 调整二维码弹出方向为向上 */
            .qr-code {
                top: auto;
                bottom: calc(100% + 15px); /* 在图标上方15px处 */
                left: 50%;
                transform: translateX(-50%) translateY(10px);
            }

            /* Update transform for JS class on mobile */
            .social-item.show-qr .qr-code {
                transform: translateX(-50%) translateY(0);
            }
            
            /* Update transform for hover on devices that have hover but are narrow */
            @media (hover: hover) and (pointer: fine) {
                .social-item:hover .qr-code {
                    transform: translateX(-50%) translateY(0);
                }
            }
        }

        /* 针对非常窄的屏幕，只显示图标 */
        @media (max-width: 480px) {
            .social-content {
                width: 44px; /* 调整为圆形按钮大小 */
                height: 44px;
                padding: 0;
                justify-content: center;
                border-radius: 50%;
            }
            .social-content span {
                display: none; /* 隐藏文字 */
            }
            .social-content i {
                margin-right: 0; /* 移除边距 */
            }
        }

    </style>
</head>
<body>

    <!-- 返回首页按钮 -->
    <a href="/" class="home-button" title="返回首页">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 18l-6-6 6-6"/>
        </svg>
        <span>首页</span>
    </a>

    <!-- 社交媒体链接 -->
    <div class="social-links">
        <!-- 视频号 -->
        <div class="social-item">
            <div class="social-content">
                <i class="fa-brands fa-meta"></i>
                <span>视频号</span>
            </div>
            <div class="qr-code">
                <img src="https://res.cloudinary.com/dapkmldat/image/upload/v1752339458/%E5%BE%AE%E4%BF%A1%E5%9B%BE%E7%89%87_20250713005717_tarl13.jpg" alt="微信视频号二维码">
            </div>
        </div>
        <!-- 公众号 -->
        <div class="social-item">
            <div class="social-content">
                <i class="fa-brands fa-weixin"></i>
                <span>公众号</span>
            </div>
            <div class="qr-code">
                <img src="https://res.cloudinary.com/dapkmldat/image/upload/v1752338817/qrcode_for_gh_bca52f9d4713_258_1_polvor.jpg" alt="微信公众号二维码">
            </div>
        </div>
        <!-- 小红书 -->
        <div class="social-item">
            <div class="social-content">
                <i class="fa-solid fa-r"></i>
                <span>小红书</span>
            </div>
            <div class="qr-code">
                <img src="https://res.cloudinary.com/dapkmldat/image/upload/v1752338817/%E5%BE%AE%E4%BF%A1%E5%9B%BE%E7%89%87_20250713004408_z60lle.jpg" alt="小红书二维码">
            </div>
        </div>
    </div>


    <div class="card-container">
        <svg width="100%" height="100%" viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <radialGradient id="techGradientV3" cx="50%" cy="100%" r="100%" fx="50%" fy="100%">
                    <stop offset="0%" style="stop-color:#101022; stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#1a1a2e; stop-opacity:1" />
                </radialGradient>
            </defs>
            <rect width="400" height="600" rx="20" ry="20" fill="url(#techGradientV3)" />
            <g transform="translate(20, 20)">
                <text x="180" y="55" font-size="28" font-weight="bold" text-anchor="middle" fill="#e0e0e0">AI时代产品匠人</text>
                <text x="180" y="85" font-size="18" text-anchor="middle" fill="#a0a0c0">詹叔</text>
                <line x1="100" y1="115" x2="260" y2="115" stroke="#4a4a6a" stroke-width="1" />
                <g text-anchor="middle" fill="#d0d0f0">
                    <text x="180" y="170" font-size="24" font-weight="bold">
                        <tspan x="180" dy="0">“在0和1的2进制世界,</tspan>
                        <tspan x="180" dy="1.4em">探寻人性的第3条路”</tspan>
                    </text>
                    <text x="180" y="250" font-size="14" fill="#8a8aa0" style="font-style: italic; letter-spacing: 0.5px;">
                        <tspan x="180" dy="0">In the binary world of 0s and 1s,</tspan>
                        <tspan x="180" dy="1.3em">seeking a third path to humanity.</tspan>
                    </text>
                </g>
                <g transform="translate(180, 345)" stroke-width="1.5" fill="none">
                    <path d="M -80 -40 H 80 M -80 -20 H 80 M -80 0 H 80 M -80 20 H 80 M -80 40 H 80
                             M -60 -50 V 50 M -30 -50 V 50 M 0 -50 V 50 M 30 -50 V 50 M 60 -50 V 50" 
                          stroke="#3a3a5a" stroke-width="1"/>
                    <!-- 探索人性的第三条路 (动态) -->
                    <path d="M -90,0 C -50,-40 50,40 90,0" stroke="#8a8aff" stroke-width="3" stroke-linecap="round">
                        <!-- 重新添加路径绘制动画 -->
                        <animate attributeName="stroke-dasharray" from="0, 260" to="260, 260" dur="8s" repeatCount="indefinite" />
                        <!-- 添加光晕闪烁效果 -->
                        <animate attributeName="stroke" values="#8a8aff;#c0c0ff;#8a8aff" dur="4s" repeatCount="indefinite" />
                    </path>
                </g>
                <text x="180" y="445" font-size="15" text-anchor="middle" fill="#b0b0d0">
                    <tspan x="180" dy="0">用代码的严谨逻辑，铺设一条通往人性温暖的道路。</tspan>
                </text>
                <g text-anchor="middle" font-size="12" fill="#7a7a9a" transform="translate(0, 520)">
                    <text x="180" y="0">#AI产品 #独立开发 #深度思考 #AGI降临派</text>
                </g>
            </g>
        </svg>
    </div>

    <!-- 新增：处理点击交互的JavaScript -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const socialItems = document.querySelectorAll('.social-item');

            socialItems.forEach(item => {
                item.addEventListener('click', function(event) {
                    // Stop the click from bubbling up to the document and immediately closing the QR code.
                    event.stopPropagation();
                    
                    const wasActive = this.classList.contains('show-qr');

                    // First, close all other QR codes.
                    document.querySelectorAll('.social-item.show-qr').forEach(activeItem => {
                        activeItem.classList.remove('show-qr');
                    });

                    // If the item was not already active, make it active.
                    // This creates a toggle effect for the same button.
                    if (!wasActive) {
                        this.classList.add('show-qr');
                    }
                });
            });

            // Add a listener to the whole document to close QR codes when clicking anywhere else.
            document.addEventListener('click', function() {
                document.querySelectorAll('.social-item.show-qr').forEach(activeItem => {
                    activeItem.classList.remove('show-qr');
                });
            });
        });
    </script>

</body>
</html>
